    <title>Undangan Pernikahan - Aan & Novita</title>
    <script>
      (function() {
        try {
          const desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.get && !desc.set) {
            Object.defineProperty(window, 'fetch', {
              get: desc.get,
              set: function(v) { console.warn('Blocked attempt to overwrite window.fetch'); },
              configurable: true,
              enumerable: true
            });
          }
        } catch(e) {}
      })();
    </script>

  </body>
